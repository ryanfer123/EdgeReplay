[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-replay-local"
version = "0.1.0"
description = "A local telemetry replay and prediction inspection studio"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["edge_replay*"]

[tool.setuptools.package-data]
edge_replay = ["web/*", "web/vendor/*"]
